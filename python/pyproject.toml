[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aisles-client"
version = "1.0.0"
description = "Python client for Aisles: is a product in stock at stores near a US city or ZIP, with the store, price and the time Aisles checked. Read-only, no key."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aisles Inc." }]
requires-python = ">=3.8"
keywords = ["aisles", "aislesinventory", "local inventory", "in stock", "shopping", "sdk"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://aislesinventory.com"
Documentation = "https://aislesinventory.com/developers"
Source = "https://github.com/aislesinventory/aisles"

[project.scripts]
aisles-py = "aisles_client.cli:main"
